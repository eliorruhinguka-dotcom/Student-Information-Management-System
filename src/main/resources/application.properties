spring.application.name=sims
spring.datasource.url=jdbc:postgresql://localhost:5432/sims_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Swagger / OpenAPI configuration

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# JWT security configuration
# Set JWT_SECRET in the environment before deployment.
# The fallback below is ONLY for local development and testing.
security.jwt.secret=${JWT_SECRET:LOCAL-DEV-ONLY-CHANGE-ME-SIMS-SECRET-2026}
security.jwt.access-token-minutes=15
security.jwt.refresh-token-days=7

# Login lockout policy
security.login.max-failed-attempts=5
security.login.lockout-minutes=15
# Optional one-time initial administrator bootstrap.
# Set all three environment variables only for the first deployment.
security.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
security.bootstrap-admin.full-name=${BOOTSTRAP_ADMIN_FULL_NAME:}
security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}